<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 380" width="100%" height="100%">
  <defs>
    <style>
      .title-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 20px; font-weight: 700; fill: #0f172a; }
      .sub-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #64748b; }
      .card-bg { rx: 12; stroke-width: 2; }
      .stage-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 16px; font-weight: 700; }
      .stage-etym { font-family: "Georgia", serif; font-size: 12px; font-style: italic; fill: #64748b; }
      .stage-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #334155; line-height: 1.4; }
      .flow-arrow { stroke: #94a3b8; stroke-width: 2.5; fill: none; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Container -->
  <rect x="10" y="10" width="900" height="360" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="460" y="45" text-anchor="middle" class="title-text">The Epistemic Lifecycle of Ideas: An Intellectual Lexicon</text>
  <text x="460" y="68" text-anchor="middle" class="sub-text">How theoretical paradigms move from porous filtration to systemic rigidity</text>

  <!-- STAGE 1: PERCOLATE -->
  <g transform="translate(30, 95)">
    <rect width="190" height="230" class="card-bg" fill="#f0fdf4" stroke="#86efac"/>
    <circle cx="95" cy="40" r="22" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
    <text x="95" y="46" text-anchor="middle" font-size="18" fill="#15803d">1</text>
    <text x="95" y="85" text-anchor="middle" class="stage-title" fill="#166534">PERCOLATE</text>
    <text x="95" y="103" text-anchor="middle" class="stage-etym">Lat. percolare (strain through)</text>
    <line x1="20" y1="115" x2="170" y2="115" stroke="#bbf7d0" stroke-width="1.5"/>
    <text x="20" y="138" class="stage-desc">• Subtle filtration</text>
    <text x="20" y="160" class="stage-desc">• Unconscious diffusion</text>
    <text x="20" y="182" class="stage-desc">• Spreading through strata</text>
    <text x="20" y="204" class="stage-desc">• Porous dissemination</text>
  </g>

  <path d="M 225 210 L 250 210" class="flow-arrow"/>

  <!-- STAGE 2: COALESCE -->
  <g transform="translate(255, 95)">
    <rect width="190" height="230" class="card-bg" fill="#eff6ff" stroke="#93c5fd"/>
    <circle cx="95" cy="40" r="22" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <text x="95" y="46" text-anchor="middle" font-size="18" fill="#1d4ed8">2</text>
    <text x="95" y="85" text-anchor="middle" class="stage-title" fill="#1e40af">COALESCE</text>
    <text x="95" y="103" text-anchor="middle" class="stage-etym">Lat. coalescere (grow together)</text>
    <line x1="20" y1="115" x2="170" y2="115" stroke="#bfdbfe" stroke-width="1.5"/>
    <text x="20" y="138" class="stage-desc">• Fragmented strands unite</text>
    <text x="20" y="160" class="stage-desc">• Unified coherent model</text>
    <text x="20" y="182" class="stage-desc">• Synthesis of evidence</text>
    <text x="20" y="204" class="stage-desc">• Paradigm formation</text>
  </g>

  <path d="M 450 210 L 475 210" class="flow-arrow"/>

  <!-- STAGE 3: INCULCATE -->
  <g transform="translate(480, 95)">
    <rect width="190" height="230" class="card-bg" fill="#fdf4ff" stroke="#f0abfc"/>
    <circle cx="95" cy="40" r="22" fill="#fae8ff" stroke="#d946ef" stroke-width="2"/>
    <text x="95" y="46" text-anchor="middle" font-size="18" fill="#a21caf">3</text>
    <text x="95" y="85" text-anchor="middle" class="stage-title" fill="#86198f">INCULCATE</text>
    <text x="95" y="103" text-anchor="middle" class="stage-etym">Lat. inculcare (tread under heel)</text>
    <line x1="20" y1="115" x2="170" y2="115" stroke="#f5d0fe" stroke-width="1.5"/>
    <text x="20" y="138" class="stage-desc">• Tenacious instruction</text>
    <text x="20" y="160" class="stage-desc">• Institutional schooling</text>
    <text x="20" y="182" class="stage-desc">• Deep cognitive imprint</text>
    <text x="20" y="204" class="stage-desc">• Intergenerational transfer</text>
  </g>

  <path d="M 675 210 L 700 210" class="flow-arrow"/>

  <!-- STAGE 4: OSSIFY -->
  <g transform="translate(705, 95)">
    <rect width="185" height="230" class="card-bg" fill="#fff7ed" stroke="#fed7aa"/>
    <circle cx="92" cy="40" r="22" fill="#ffedd5" stroke="#f97316" stroke-width="2"/>
    <text x="92" y="46" text-anchor="middle" font-size="18" fill="#c2410c">4</text>
    <text x="92" y="85" text-anchor="middle" class="stage-title" fill="#9a3412">OSSIFY</text>
    <text x="92" y="103" text-anchor="middle" class="stage-etym">Lat. ossificare (turn to bone)</text>
    <line x1="15" y1="115" x2="170" y2="115" stroke="#ffedd5" stroke-width="1.5"/>
    <text x="18" y="138" class="stage-desc">• Loss of intellectual vitality</text>
    <text x="18" y="160" class="stage-desc">• Calcified dogma</text>
    <text x="18" y="182" class="stage-desc">• Resistance to novelty</text>
    <text x="18" y="204" class="stage-desc">• Intellectual decadence</text>
  </g>
</svg>
