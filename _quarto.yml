project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "**/*.qmd"
    - "!GEMINI.md"
    - "!README.md"

author: "Igor Kan"

website:
  title: "English Mastery"
  site-url: "https://igor-kan.github.io/english-language"
  repo-url: "https://github.com/igor-kan/english-language"
  description: "A comprehensive, tag-driven curriculum covering linguistic architecture, precision vocabulary, rhetoric, negotiation, and debate."
  page-footer: "© 2026 Igor Kan"
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: articles.qmd
        text: All Articles & Tags
      - href: curriculum.qmd
        text: Learning Roadmap
      - href: about.qmd
        text: About

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    css: styles.css
    toc: true
    toc-depth: 3
    math: true
    code-fold: show
    code-tools: true
    code-copy: true
    date-format: "YYYY-MM-DD"
